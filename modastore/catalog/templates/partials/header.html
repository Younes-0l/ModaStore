<header class="site-header">
    <div class="container header-row">
        <button class="icon-btn menu-toggle" type="button"
                aria-label="باز کردن منو" aria-expanded="false" aria-controls="mobile-menu">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <a href="{% url 'catalog:home' %}" class="logo" aria-label="ModaStore">
            Moda<span>Store</span>
        </a>

        <nav class="main-nav" aria-label="منوی اصلی">
            <a href="{% url 'catalog:home' %}">خانه</a>
            <a href="#">محصولات</a>
            <a href="#">مجله</a>
            <a href="#">درباره ما</a>
            <a href="#">تماس با ما</a>
        </nav>

        <form class="search-form search-form--desktop" action="#" method="get" role="search">
            <input type="search" name="q" placeholder="جست‌وجوی محصول..." aria-label="جست‌وجو">
            <button type="submit" aria-label="جست‌وجو">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </button>
        </form>

        <div class="header-actions">
            <a href="#" class="icon-btn" aria-label="سبد خرید">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2L20 7H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>
                {# Cart item count badge will be added in the cart phase #}
            </a>
            {% if user.is_authenticated %}
            <a href="#" class="icon-btn" aria-label="حساب کاربری">
            {% else %}
            <a href="#" class="icon-btn" aria-label="ورود یا ثبت‌نام">
            {% endif %}
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            </a>
        </div>
    </div>

    <form class="search-form search-form--mobile container" action="#" method="get" role="search">
        <input type="search" name="q" placeholder="جست‌وجوی محصول..." aria-label="جست‌وجو">
        <button type="submit" aria-label="جست‌وجو">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
    </form>
</header>

<div class="menu-overlay" hidden></div>
<aside class="mobile-menu" id="mobile-menu" aria-hidden="true">
    <div class="mobile-menu__head">
        <span class="logo">Moda<span>Store</span></span>
        <button class="icon-btn menu-close" type="button" aria-label="بستن منو">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
    </div>
    <nav class="mobile-menu__nav" aria-label="منوی موبایل">
        <a href="{% url 'catalog:home' %}">خانه</a>
        <a href="#">محصولات</a>
        <a href="#">مجله</a>
        <a href="#">درباره ما</a>
        <a href="#">تماس با ما</a>
        <a href="#">سبد خرید</a>
        <a href="#">{% if user.is_authenticated %}حساب کاربری{% else %}ورود / ثبت‌نام{% endif %}</a>
    </nav>
</aside>
